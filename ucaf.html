<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>زيارات UCAF اليومية</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --text: #1d2433; --muted: #6b7385; --line: #e3e7ee;
    --accent: #0f6cbd; --accent-soft: #e6f0fa; --danger: #c42b1c; --warn: #9a5b00; --warn-soft: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #98a1b3; --line: #2b3240;
            --accent: #5aa7ec; --accent-soft: #1c2b3d; --danger: #ff7a6b; --warn: #ffc46b; --warn-soft: #3a2c12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input, button, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                          background: var(--card); color: var(--text); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #search { flex: 1; min-width: 200px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 22px; margin-top: 4px; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.list th, table.list td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.list th { position: sticky; top: 0; background: var(--accent-soft); cursor: pointer; user-select: none; }
  table.list tbody tr { cursor: pointer; }
  table.list tbody tr:hover { background: var(--accent-soft); }
  table.list tr.patient-first td { border-top: 2px solid var(--line); }
  .pending { color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 2px 6px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  #login { max-width: 360px; margin: 60px auto; display: grid; gap: 10px; }
  #loginErr, #err { color: var(--danger); font-size: 14px; }
  .hidden { display: none !important; }

  /* نافذة النموذج */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); overflow: auto; padding: 16px; z-index: 10; }
  .overlay-bar { max-width: 210mm; margin: 0 auto 8px; display: flex; gap: 8px; justify-content: flex-start; }

  /* نموذج UCAF — ورقة بيضا دايمًا حتى في الوضع الليلي */
  .ucaf { direction: ltr; text-align: left; background: #fff; color: #000; width: 100%; max-width: 210mm;
          margin: 0 auto 16px; padding: 8mm; font: 11px/1.35 Arial, Helvetica, sans-serif; }
  .ucaf .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 4px; }
  .ucaf .top .ids, .ucaf .top .pg { color: #c00; font-weight: bold; font-size: 13px; }
  .ucaf .top .pg { text-align: right; }
  .ucaf .top h2 { margin: 0; font-size: 22px; }
  .ucaf .box { border: 1px solid #000; padding: 4px 6px; margin-bottom: 4px; }
  .ucaf .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid #000; margin-bottom: 4px; }
  .ucaf .two > div { padding: 4px 6px; }
  .ucaf .two > div + div { border-left: 1px solid #000; }
  .ucaf h3 { margin: 0 0 2px; font-size: 13px; }
  .ucaf .row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .ucaf .pre { white-space: pre-line; font-weight: bold; padding-left: 10px; }
  .ucaf .ar { direction: rtl; text-align: center; }
  .ucaf .note { color: #1a5fb4; padding-left: 10px; }
  .ucaf table { width: 100%; border-collapse: collapse; margin-top: 3px; }
  .ucaf th, .ucaf td { border: 1px solid #000; padding: 2px 4px; text-align: left; vertical-align: top; white-space: normal; }
  .ucaf th { font-weight: normal; background: none; position: static; }
  .ucaf td.num { text-align: right; }
  .ucaf .total { text-align: right; padding: 2px 4px; }
  .ucaf .sig { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #000; margin-bottom: 4px; }
  .ucaf .sig > div { padding: 6px; }
  .ucaf .sig > div + div { border-left: 1px solid #000; }
  .ucaf .foot { font-size: 10px; }

  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 6mm; }
    body { background: #fff; }
    header button, .toolbar { display: none; }
    body.printing-forms > *:not(#printArea) { display: none !important; }
    body.printing-forms #printArea { display: block; }
    .ucaf { padding: 0; margin: 0; max-width: none; page-break-after: always; break-after: page; }
    .ucaf:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>زيارات UCAF اليومية</h1>
    <div class="muted" id="lastSync"></div>
  </div>
  <div class="hidden" id="userBox"><span class="muted" id="userEmail"></span> <button id="logout">خروج</button></div>
</header>

<main>
  <form id="login" class="card hidden">
    <strong>تسجيل الدخول</strong>
    <input id="email" type="email" placeholder="الإيميل" autocomplete="username" required>
    <input id="password" type="password" placeholder="الباسورد" autocomplete="current-password" required>
    <button class="primary" type="submit">دخول</button>
    <div id="loginErr"></div>
  </form>

  <section id="app" class="hidden">
    <div class="toolbar">
      <button id="prev" title="اليوم السابق">→</button>
      <input id="date" type="date">
      <button id="next" title="اليوم التالي">←</button>
      <button id="today">النهارده</button>
      <select id="doctor"><option value="">كل الدكاترة</option></select>
      <input id="search" type="search" placeholder="بحث: اسم المريض، رقم الملف، رقم الزيارة، التشخيص…">
      <button id="printForms" class="primary">طباعة نماذج UCAF</button>
      <button id="csv">تصدير CSV</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted">عدد الزيارات</span><b id="sVisits">0</b></div>
      <div class="stat"><span class="muted">عدد المرضى</span><b id="sPatients">0</b></div>
      <div class="stat"><span class="muted">تأمين / نقدي</span><b id="sPay">0</b></div>
      <div class="stat"><span class="muted">نموذج لسه ماتكتبش</span><b id="sPending">0</b></div>
    </div>
    <div id="err"></div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <div class="empty hidden" id="empty">مفيش زيارات في اليوم ده</div>
    </div>
  </section>
</main>

<div id="modal" class="overlay hidden">
  <div class="overlay-bar">
    <button id="mPrint" class="primary">طباعة النموذج</button>
    <button id="mClose">إغلاق</button>
  </div>
  <div id="mBody"></div>
</div>

<div id="printArea"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, onSnapshot, doc }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // نفس إعدادات Firebase بتاعة المشروع (Project settings → Your apps)
  const firebaseConfig = {
    apiKey: "AIzaSyDSAoCykH0eaKC5lw-b300s7lHDwYTBeq0",
    authDomain: "clinic-ucaf.firebaseapp.com",
    projectId: "clinic-ucaf",
  };

  const PROVIDER_NAME = "AL-HADI MEDICAL CLINIC";
  const PROVIDER_NAME_AR = "مجمع عيادات الهادى الطبى";

  // الأعمدة اللي بتظهر في الجدول: key = اسم العمود في query.sql
  const COLUMNS = [
    { key: "VisitTime",   label: "الوقت" },
    { key: "VisitId",     label: "رقم الزيارة" },
    { key: "FileNo",      label: "رقم الملف" },
    { key: "PatientName", label: "اسم المريض" },
    { key: "Doctor",      label: "الدكتور" },
    { key: "Clinic",      label: "العيادة" },
    { key: "VisitType",   label: "نوع الزيارة" },
    { key: "Payment",     label: "الدفع" },
    { key: "Insurance",   label: "شركة التأمين" },
    { key: "CafeType",    label: "النموذج" },
    { key: "Diagnosis",   label: "التشخيص" },
  ];
  const PENDING = "لم يُكتب";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat("ar-EG", { maximumFractionDigits: 2 });

  let rows = [], shown = [], sortKey = "VisitTime", sortDir = 1, unsubVisits = null, unsubMeta = null, current = null;

  const isoDate = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const e = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const J = (s) => { try { return JSON.parse(s || "[]") || []; } catch { return []; } };
  const n2 = (v) => typeof v === "number" ? v.toFixed(2) : e(v);

  $("head").innerHTML = COLUMNS.map((c) => `<th data-key="${c.key}">${c.label}</th>`).join("");
  $("head").addEventListener("click", (ev) => {
    const k = ev.target.dataset.key; if (!k) return;
    sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render();
  });

  function filtered() {
    const q = $("search").value.trim().toLowerCase();
    const dr = $("doctor").value;
    let list = rows.filter((r) => (!dr || r.Doctor === dr) &&
      (!q || COLUMNS.some((c) => String(r[c.key] ?? "").toLowerCase().includes(q))));
    const cmp = (a, b, k) => {
      const x = a[k] ?? "", y = b[k] ?? "";
      return typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "ar");
    };
    return list.sort((a, b) => sortDir * cmp(a, b, sortKey) || cmp(a, b, "PatientName") || cmp(a, b, "VisitTime"));
  }

  function fillDoctors() {
    const sel = $("doctor"), keep = sel.value;
    const docs = [...new Set(rows.map((r) => r.Doctor).filter(Boolean))].sort();
    sel.innerHTML = `<option value="">كل الدكاترة</option>` + docs.map((d) => `<option>${e(d)}</option>`).join("");
    sel.value = docs.includes(keep) ? keep : "";
  }

  function render() {
    shown = filtered();
    let prevPatient = null;
    $("body").innerHTML = shown.map((r, i) => {
      const pid = r.FileNo ?? r.PatientName;
      const first = pid !== prevPatient; prevPatient = pid;
      return `<tr data-i="${i}" class="${first ? "patient-first" : ""}">` + COLUMNS.map((c) =>
        c.key === "CafeType" && r.CafeType === PENDING ? `<td><span class="pending">${PENDING}</span></td>` : `<td>${e(r[c.key])}</td>`
      ).join("") + "</tr>";
    }).join("");
    $("empty").classList.toggle("hidden", shown.length > 0);
    $("sVisits").textContent = fmt.format(shown.length);
    $("sPatients").textContent = fmt.format(new Set(shown.map((r) => r.FileNo ?? r.PatientName)).size);
    const insured = shown.filter((r) => r.PaymentCode === "R").length;
    $("sPay").textContent = `${fmt.format(insured)} / ${fmt.format(shown.length - insured)}`;
    $("sPending").textContent = fmt.format(shown.filter((r) => r.CafeType === PENDING).length);
    document.querySelectorAll("#head th").forEach((th) =>
      th.textContent = COLUMNS.find((c) => c.key === th.dataset.key).label + (th.dataset.key === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : ""));
  }

  // ---------- نموذج UCAF ----------
  function ucafHtml(r, page, pages) {
    const tick = (b) => (b ? "✔" : "&nbsp;&nbsp;");
    const diags = J(r.DiagnosesJson);
    const svcs = J(r.ServicesJson);
    const meds = J(r.MedsJson);
    const code = (i) => e(diags[i]?.Code ?? "");
    const total = svcs.reduce((s, x) => s + (Number(x.Cost) || 0), 0);
    const blank = (n) => Array.from({ length: n }, () => "<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>").join("");
    const blankM = (n) => Array.from({ length: n }, () => "<tr><td>&nbsp;</td><td></td><td></td></tr>").join("");
    const extra = [
      r.DiagDateTime && `G_DATE: ${e(r.DiagDateTime)}`,
      r.Notes && `Notes: ${e(r.Notes)}`,
      r.PatientHistory && `PatientHistory: ${e(r.PatientHistory)}`,
      r.CarePlan && `Care_Plan: ${e(r.CarePlan)}`,
    ].filter(Boolean).join(" - ");

    return `
    <div class="ucaf">
      <div class="top">
        <div class="ids">${e(r.IdNo)} : ${e(r.FileNo)} : ${e(r.VisitId)}</div>
        <h2>UCAF 2.0</h2>
        <div class="pg">${pages ? `Page No ${page} From ${pages}` : ""}</div>
      </div>

      <div class="two">
        <div>
          <h3>To be completed &amp; ID verified by Reception/Nurse:</h3>
          Provider Name: ${PROVIDER_NAME} <span class="ar">${PROVIDER_NAME_AR}</span><br>
          Ins.Co : ${e(r.Insurance)}<br>
          Patient File No: ${e(r.FileNo)} &nbsp; TPA Co. : ${e(r.Tpa)}<br>
          Single( ) Married( ) Plan Type( ) &nbsp; Dept: ${e(r.Clinic)}<br>
          Date Of visit ${e(r.VisitDateDmy)}<br>
          New visit(${tick(r.VisitTypeCode === "V")}) Follow Up(${tick(r.VisitTypeCode === "R")}) Refill( ) Walk In( ) Referral( )
        </div>
        <div>
          Policy Holder: ${e(r.PolicyHolder)}<br>
          Policy No: ${e(r.PolicyNo)} &nbsp; MemberShip No: ${e(r.MembershipNo)}<br>
          Incured Name: ${e(r.PatientName)}<br>
          <div class="ar" dir="auto">${e(r.PatientName2)}</div>
          ID. No: ${e(r.IdNo)} &nbsp; Sex: ${e(r.Sex)} &nbsp; Age: ${e(r.Age)} Y<br>
          DOB: ${e(r.Dob)}<br>
          Expire Date ${e(r.ExpireDate)} &nbsp; Class ${e(r.Class)}<br>
          Aproval ${e(r.ApprovalNo)}
        </div>
      </div>

      <div class="box">
        <h3>To be Completed Attending physician : Please tick ( ✔ )</h3>
        <div class="row">
          <span>Inpatient ( ) Outpatient ( ✔ )</span>
          <span>Emergency Case ( )</span><span>Emergency Case level 1 ( ) 2 ( ) 3 ( )</span>
        </div>
        <div class="row">
          <span>BP: ${e(r.BP)}</span><span>Pulse: ${e(r.Pulse)}</span><span>Temp: ${e(r.Temp)} C</span>
          <span>Weight: ${e(r.Weight)} KG</span><span>Height: ${e(r.Height)} CM</span><span>R.R: ${e(r.RR)}</span>
          <span>Duration of illness: ${e(r.Duration)}</span>
        </div>
        Chief Complaint and Main Symptoms :
        <div class="pre">${e(r.ChiefComplaint)}</div>
        ${extra ? `<div class="note">${extra}</div>` : ""}
        Significant Signs:
        <div class="pre">${e(r.Signs)}</div>
        <div>Diagnosis &nbsp; ${diags.map((d) => e(d.Name)).join(" &nbsp; ")}</div>
        <div class="row">
          <span>Principal Code: ${code(0)}</span><span>2 Code : ${code(1)}</span>
          <span>3 Code : ${code(2)}</span><span>4 Code : ${code(3)}</span>
        </div>
        <hr style="border:0;border-top:1px solid #000;margin:3px 0">
        Please tick ( ✔ ) where appropriate
        <div class="row">
          <span>Chronic ( )</span><span>Congenital ( )</span><span>RTA ( )</span><span>Work Related ( )</span>
          <span>Vaccination ( )</span><span>Check-Up ( )</span><span>Psyvhiatric ( )</span><span>Infertility ( )</span>
          <span>Pregnancy ( )</span><span>Indicate LMP:</span>
        </div>
        Suggestive line(s)of managment: Kindly,enumerate the recommended investigations.and/or procedures for Outpatient approval only:
        <table>
          <thead><tr><th style="width:12%">CODE</th><th>Description/Services</th><th style="width:25%">Type</th><th style="width:7%">Qty</th><th style="width:9%">Cost</th></tr></thead>
          <tbody>
            ${svcs.map((s) => `<tr><td>${e(s.Code)}</td><td>${e(s.Description)}</td><td>${e(s.Type)}</td><td class="num">${n2(s.Qty)}</td><td class="num">${n2(s.Cost)}</td></tr>`).join("")}
            ${blank(Math.max(0, 5 - svcs.length))}
          </tbody>
        </table>
        <div class="total">Total &nbsp; ${total.toFixed(2)}</div>
        Provider's Approval/Coding Staff must review/code the recommeded service(s)&amp; allocate cost and complete the followig:<br>
        Completed/Coded By: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Signtrue &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Date :
        <table>
          <thead><tr><th>Medication Name (Generic Name)</th><th style="width:30%">Type</th><th style="width:10%">Quanitity</th></tr></thead>
          <tbody>
            ${meds.map((m) => `<tr><td>${e(m.Code)} &nbsp; ${e(m.Name)}</td><td>${e(m.Type)}</td><td class="num">${n2(m.Qty)}</td></tr>`).join("")}
            ${blankM(Math.max(0, 5 - meds.length))}
          </tbody>
        </table>
        In Case Management Form (CMF 1.0) included &nbsp; YES ( ) No ( )<br>
        Please specify possible Line of Management when applicable:<br>
        Estimated length of stay:.......... days &nbsp;&nbsp;&nbsp; Expected Date of Admission: &nbsp; / &nbsp; /
      </div>

      <div class="sig">
        <div>Ihereby certify that ALL information mentioned are correct and that the medical services shown on this form
          were medically indicated and necessary for the management of this case<br>
          Physician &nbsp; Signture &nbsp; Stamp &nbsp; Date ${e(r.VisitDateDmy)}<br>
          ${e(r.Doctor)}${r.DoctorDegree ? " : " + e(r.DoctorDegree) : ""}</div>
        <div>Ihereby certify that ALL statements and information provided concerning patient identification and the
          present illness or injury are TRUE<br>Name (and relationship (if guardian):<br>Signture(*)............... Date..../..../....</div>
      </div>

      <div class="box">
        For Insurance Company Use Only &nbsp;&nbsp; Approved( ) &nbsp; Not Approved( ) &nbsp; Aproval No: &nbsp; Approval validity:....... Days<br>
        Comments (include approved days/services if diffrent from the requested)..........................<br><br>
        Approved/Disapproved By .................................................. Signture(*) .................................................. Date......../.../.......
      </div>
      <div class="foot">(*) This is applicable only in case of manual UCAF</div>
    </div>`;
  }

  function openForm(r) {
    current = r;
    $("mBody").innerHTML = ucafHtml(r);
    $("modal").classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }
  function closeForm() {
    $("modal").classList.add("hidden");
    document.body.style.overflow = "";
    current = null;
  }
  function printForms(list) {
    if (!list.length) return;
    $("printArea").innerHTML = list.map((r, i) => ucafHtml(r, i + 1, list.length)).join("");
    document.body.classList.add("printing-forms");
    window.print();
  }
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("printing-forms");
    $("printArea").innerHTML = "";
  });

  $("body").addEventListener("click", (ev) => {
    const tr = ev.target.closest("tr[data-i]");
    if (tr) openForm(shown[+tr.dataset.i]);
  });
  $("mClose").onclick = closeForm;
  $("modal").addEventListener("click", (ev) => { if (ev.target.id === "modal") closeForm(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && current) closeForm(); });
  $("mPrint").onclick = () => current && printForms([current]);
  $("printForms").onclick = () => {
    const list = shown.filter((r) => r.CafeType !== PENDING);
    if (!list.length) return alert("مفيش نماذج مكتوبة في القايمة دي");
    printForms(list);
  };

  // ---------- تحميل البيانات ----------
  function load(date) {
    $("date").value = date;
    $("err").textContent = "";
    if (unsubVisits) unsubVisits();
    // onSnapshot: الصفحة بتتحدث لوحدها أول ما المزامنة ترفع بيانات جديدة
    unsubVisits = onSnapshot(query(collection(db, "ucaf_visits"), where("VisitDate", "==", date)),
      (snap) => { rows = snap.docs.map((d) => d.data()); fillDoctors(); render(); },
      (err) => { $("err").textContent = err.code === "permission-denied" ? "حسابك مش مسموحله يشوف البيانات دي" : err.message; });
  }

  function shift(days) {
    const d = new Date($("date").value + "T12:00:00"); d.setDate(d.getDate() + days); load(isoDate(d));
  }

  $("date").addEventListener("change", (ev) => ev.target.value && load(ev.target.value));
  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("today").onclick = () => load(isoDate(new Date()));
  $("search").addEventListener("input", render);
  $("doctor").addEventListener("change", render);

  $("csv").onclick = () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [COLUMNS.map((c) => esc(c.label)).join(","), ...shown.map((r) => COLUMNS.map((c) => esc(r[c.key])).join(","))];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    a.download = `ucaf-${$("date").value}.csv`; a.click(); URL.revokeObjectURL(a.href);
  };

  $("login").addEventListener("submit", async (ev) => {
    ev.preventDefault(); $("loginErr").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
    catch { $("loginErr").textContent = "الإيميل أو الباسورد غلط"; }
  });
  $("logout").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    $("login").classList.toggle("hidden", !!user);
    $("app").classList.toggle("hidden", !user);
    $("userBox").classList.toggle("hidden", !user);
    if (unsubVisits) { unsubVisits(); unsubVisits = null; }
    if (unsubMeta) { unsubMeta(); unsubMeta = null; }
    rows = []; $("lastSync").textContent = "";
    closeForm();
    if (!user) return;
    $("userEmail").textContent = user.email;
    unsubMeta = onSnapshot(doc(db, "ucaf_meta", "lastSync"), (s) => {
      const m = s.data(); if (!m) return;
      $("lastSync").textContent = "آخر تحديث: " + m.at.toDate().toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" });
    }, () => {});
    load(isoDate(new Date()));
  });
</script>
</body>
</html>
